<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Head Start Outreach Map - Poverty & Housing</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        /* Control box styling */
        .leaflet-control-layers {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Custom Title Styling */
        .control-title {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ccc;
            max-width: 250px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>
    // 1. Define the center coordinates
    const lat = 42.39676629287921;
    const lng = -71.1031099204534;

    // 2. Initialize the map
    const map = L.map('map').setView([lat, lng], 13);

    // 3. Add MassGIS Basemaps
    L.tileLayer('https://tiles.arcgis.com/tiles/hGdibHYSPO59RG1h/arcgis/rest/services/MassGISBasemap/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: '&copy; MassGIS'
    }).addTo(map);

    L.tileLayer('https://tiles.arcgis.com/tiles/hGdibHYSPO59RG1h/arcgis/rest/services/MassGIS_Basemap_Detailed_Features/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: '&copy; MassGIS Detailed Features'
    }).addTo(map);

    // 4. Create the 3-mile buffer 
    L.circle([lat, lng], {
        color: 'red',
        weight: 2,
        fillColor: 'transparent',
        fillOpacity: 0,
        radius: 3 * 1609.344,
        interactive: false 
    }).addTo(map);

    // 5. Add Center Marker
    L.marker([lat, lng]).addTo(map)
      .bindPopup("<b>Riverside Community Care Early Head Start</b><br>Outreach Centerpoint").openPopup();

    // 6. Initialize Layer Control Box safely using empty objects {} instead of null
    const layerControl = L.control.layers({}, {}, { collapsed: false }).addTo(map);

    // --- ADD CUSTOM TITLE TO LAYER CONTROL SAFELY ---
    const controlContainer = layerControl.getContainer();
    if (controlContainer) {
        const titleDiv = document.createElement('div');
        titleDiv.className = 'control-title';
        titleDiv.innerHTML = "Outreach Planning: Poverty Demographics & Housing";
        controlContainer.prepend(titleDiv);
    }

    // --- CENSUS TRACT POVERTY DATA (Esri Living Atlas) ---
    const childPovertyTracts = L.esri.featureLayer({
        url: 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/ACS_Poverty_by_Age_Boundaries/FeatureServer/2',
        style: function (feature) {
            const props = feature.properties;
            
            // Sum up the poverty counts for the three age brackets under 18
            const childrenInPoverty = (props.B17020_003E || 0) + (props.B17020_004E || 0) + (props.B17020_005E || 0);

            // Determine the color shade based on poverty count
            let fillColor = '#f2f2f2'; // Default Gray
            if (childrenInPoverty > 250) fillColor = '#800026';
            else if (childrenInPoverty > 100) fillColor = '#E31A1C';
            else if (childrenInPoverty > 50) fillColor = '#FD8D3C';
            else if (childrenInPoverty > 10) fillColor = '#FED976';

            return {
                fillColor: fillColor,
                weight: 1,
                opacity: 0.8,
                color: '#ffffff',
                fillOpacity: 0.65
            };
        }
    });

    childPovertyTracts.bindPopup(function (layer) {
        const props = layer.feature.properties;
        const childrenInPoverty = (props.B17020_003E || 0) + (props.B17020_004E || 0) + (props.B17020_005E || 0);
        return `
            <div style="font-size: 14px;">
                <b>Census Tract:</b> ${props.GEOID}<br>
                <hr style="margin: 5px 0;">
                <b>Total Children in Poverty:</b> <span style="color:red; font-weight:bold;">${childrenInPoverty}</span><br>
                <ul style="margin: 5px 0; padding-left: 20px; font-size: 12px;">
                    <li>Under 6 years: ${props.B17020_003E || 0}</li>
                    <li>6 to 11 years: ${props.B17020_004E || 0}</li>
                    <li>12 to 17 years: ${props.B17020_005E || 0}</li>
                </ul>
            </div>
        `;
    });

    childPovertyTracts.addTo(map);
    layerControl.addOverlay(childPovertyTracts, `<span style='color:#E31A1C; font-weight:bold;'>■</span> Children in Poverty (Tracts)`);

    // --- LOCAL HOUSING DATA (JSON FILES) ---
    function loadCityHousingData(filePath, layerName, markerColor) {
        const layerGroup = L.layerGroup();

        fetch(filePath)
            .then(response => {
                if (!response.ok) throw new Error(`Could not load ${filePath}`);
                return response.json();
            })
            .then(data => {
                const targetObject = data.find(obj => obj.data && obj.data.buildingSearch && obj.data.buildingSearch.allResults);
                
                if (targetObject) {
                    const buildings = targetObject.data.buildingSearch.allResults;
                    buildings.forEach(building => {
                        if (building.location && building.location.latitude && building.location.longitude) {
                            const marker = L.circleMarker([building.location.latitude, building.location.longitude], {
                                color: '#ffffff',
                                weight: 1.5,
                                fillColor: markerColor,
                                fillOpacity: 0.9,
                                radius: 6
                            });

                            marker.bindPopup(`<b>${building.name || "Unnamed Facility"}</b><br>City: ${layerName}<br>ID: ${building.slug || building.id}`);
                            layerGroup.addLayer(marker);
                        }
                    });
                }
            })
            .catch(err => console.error(err));

        layerGroup.addTo(map);
        layerControl.addOverlay(layerGroup, `<span style='color:${markerColor}; font-weight:bold; font-size:16px;'>●</span> ${layerName} Housing`);
    }

    // Load each of the uploaded JSON files from the data directory
    loadCityHousingData('data/Everett.json', 'Everett', '#e6194b');    
    loadCityHousingData('data/Malden.json', 'Malden', '#911eb4');      
    loadCityHousingData('data/Medford.json', 'Medford', '#f58231');    
    loadCityHousingData('data/Somerville.json', 'Somerville', '#4363d8'); 

</script>
</body>
</html>
