<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Head Start Outreach Map - Poverty & Housing</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;}
        
        /* Control box styling */
        .leaflet-control-layers {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-title {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ccc;
            max-width: 250px;
        }

        /* --- MODAL POPUP STYLING --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            line-height: 1.6;
        }

        .modal-content h2 { margin-top: 0; color: #2c3e50; font-size: 24px; }
        .modal-content h3 { margin-bottom: 10px; color: #34495e; border-bottom: 1px solid #eee; padding-bottom: 5px; font-size: 18px; }
        .modal-content p { font-size: 15px; color: #444; margin-bottom: 15px; }
        .modal-content a { color: #0077FF; text-decoration: none; }
        .modal-content a:hover { text-decoration: underline; }
        
        .legend-list { list-style: none; padding: 0; margin-bottom: 20px; font-size: 15px; color: #444; }
        .legend-list li { margin-bottom: 8px; display: flex; align-items: center; }
        
        .color-scale { display: flex; flex-direction: column; margin-left: 20px; margin-top: 10px; margin-bottom: 20px;}
        .color-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 14px;}
        .color-box { width: 18px; height: 18px; margin-right: 10px; border: 1px solid #ccc; border-radius: 3px; }

        .caveat-box {
            background: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            font-size: 14px;
            color: #555;
            font-style: italic;
            margin-bottom: 20px;
